name: Workers runtime
on:
  push:
    paths:
      - 'cloudflare/control-plane/**'
      - '.github/workflows/workers-runtime.yml'
  pull_request:
    paths:
      - 'cloudflare/control-plane/**'
      - '.github/workflows/workers-runtime.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/control-plane/package-lock.json
      - run: npm ci
      - run: npm run check
