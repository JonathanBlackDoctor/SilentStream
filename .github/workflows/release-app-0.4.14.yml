name: release app 0.4.14

# App 0.4.14 adds opt-in document Drive upload; reviewed helper/startup 0.4.12 trust stays unchanged.
on:
  push:
    branches: ["claude/relaxed-davinci-qmmjwl"]
    paths: ["docs/RELEASE_NOTES_0.4.14.md", ".github/workflows/release-app-0.4.14.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Share the production publication lock with previous app releases.
  group: release-app-0.4.6
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refuse to replace an existing release
        run: |
          gh release view v0.4.14 --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'v0.4.14 already exists; do not replace published updates.' }
          $global:LASTEXITCODE = 0
      - name: Verify core and mobile behavior
        run: |
          dotnet test tests/SilentStream.Inspection.Tests/SilentStream.Inspection.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Installer download validation failed.' }
          & ./inspection/deployment/Test-ExistingRegistrationUpdate.ps1
          & ./inspection/deployment/Test-InstallerRecovery.ps1
          dotnet test tests/SilentStream.Tests/SilentStream.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          dotnet test tests/SilentStream.Inspection.Windows.Tests/SilentStream.Inspection.Windows.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Inspection tests failed.' }
          dotnet test tests/SilentStream.Media.Windows.Tests/SilentStream.Media.Windows.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Windows audio tests failed." }
          node --test tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Direct remote tests failed.' }
          node --test cloudflare/control-plane/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Room PWA tests failed.' }
      - name: Publish app and uninstall helper
        run: |
          dotnet publish src/SilentStream.App/SilentStream.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=0.4.14 -p:DebugType=None -p:DebugSymbols=false -o publish
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed.' }
          dotnet publish src/SilentStream.UninstallHelper/SilentStream.UninstallHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=0.4.14 -p:DebugType=None -p:DebugSymbols=false -o publish/uninstall-helper
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall helper publish failed.' }
      - name: Preserve verified production sidecars
        run: |
          gh release download v0.4.3 --repo "$env:GITHUB_REPOSITORY" --pattern MediaCaptureHelper-win-Portable.zip --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed.' }
          $archive = 'previous/MediaCaptureHelper-win-Portable.zip'
          $expected = '7c6a08082030fbec5a3689e7e2309fa52a4269acb1ecbda502a1f1acac270331'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Production sidecar archive hash mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath previous/extracted
          foreach ($directory in @('ffmpeg','cloudflared','yt-dlp')) {
            $source = "previous/extracted/current/$directory"
            if (-not (Test-Path -LiteralPath $source)) { throw "Missing production sidecar: $directory" }
            Copy-Item -LiteralPath $source -Destination "publish/$directory" -Recurse
          }
          foreach ($file in @('client_secret.json','THIRD_PARTY_NOTICES.md')) {
            $source = "previous/extracted/current/$file"
            if (-not (Test-Path -LiteralPath $source)) { throw "Missing production asset: $file" }
            Copy-Item -LiteralPath $source -Destination "publish/$file"
          }
          foreach ($optional in @('provisioning.json')) {
            $source = "previous/extracted/current/$optional"
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination "publish/$optional" -Recurse }
          }
      - name: Bundle externally signed helper update
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path publish/inspection-update -Force | Out-Null
          gh release download inspection-agent-v0.4.12 --repo "$env:GITHUB_REPOSITORY" --pattern inspection-agent-0.4.12.zip --dir publish/inspection-update
          if ($LASTEXITCODE -ne 0) { throw 'Signed helper download failed.' }
          $signed = 'publish/inspection-update/inspection-agent-0.4.12.zip'
          if ((Get-Item -LiteralPath $signed).Length -ne 202807544 -or (Get-FileHash -LiteralPath $signed -Algorithm SHA256).Hash.ToLowerInvariant() -ne '89581f7038058d1d31293299e2d0750da01ed356c041cfc64fdb5af123243a95') { throw 'Signed helper archive differs from the approved payload.' }
          dotnet publish src/SilentStream.Inspection.OperatorCli/SilentStream.Inspection.OperatorCli.csproj -c Release -r win-x64 --self-contained false -p:Version=0.4.12 -o verification-cli
          if ($LASTEXITCODE -ne 0) { throw 'Helper verifier build failed.' }
          dotnet verification-cli/SilentStreamInspectionCli.dll agent-update verify $signed inspection/releases/0.4.12/silentstream-ops-20261017.public-key.json verified-agent-update
          if ($LASTEXITCODE -ne 0) { throw 'Helper signature verification failed.' }
      - name: Pack and publish immutable app update
        run: |
          dotnet tool install -g vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Velopack install failed.' }
          vpk pack --packId MediaCaptureHelper --packVersion 0.4.14 --packDir publish --mainExe MediaCaptureHelper.exe --packTitle 'Media Capture Helper' --packAuthors 'Media Capture Helper' --delta None --outputDir Releases
          if ($LASTEXITCODE -ne 0) { throw 'Velopack pack failed.' }
          $assets = @(Get-ChildItem Releases -File | ForEach-Object FullName)
          if ($assets.Count -lt 4) { throw 'Release assets are incomplete.' }
          & ./inspection/deployment/Build-RecoveryRelease.ps1 -Version '0.4.14' -SigningMaterialVersion '0.4.12'
          if ($LASTEXITCODE -ne 0) { throw 'Recovery package preparation failed.' }
          gh release create v0.4.14 @assets SilentStream-prepared-package-v0.4.14.zip SilentStream-Central-Installer-v0.4.14.exe recovery-metadata-0.4.14.json --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Media Capture Helper 0.4.14' --notes-file docs/RELEASE_NOTES_0.4.14.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
