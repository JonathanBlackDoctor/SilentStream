<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=1">
  <title>SilentStream 호실 제어</title>
  <style>
:root{color-scheme:light;font-family:"Segoe UI","Noto Sans KR",system-ui,sans-serif;color:#202c34;background:#f3f5f4;--muted:#65756f;--line:#e1e7e3;--good:#26775c;--bad:#b84940}
*{box-sizing:border-box}body{margin:0;min-width:320px}body.auth-pending .shell{visibility:hidden}.shell{max-width:1100px;margin:auto;padding:max(30px,env(safe-area-inset-top)) 24px max(36px,env(safe-area-inset-bottom))}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:40px;height:40px;border-radius:12px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;margin:0 0 4px;color:var(--muted)}h1{font-size:24px;margin:0;font-weight:650;letter-spacing:-.04em}.who{font-size:11px;color:var(--muted);text-align:right;line-height:1.7}.who a,.footer a{color:#52655b;text-underline-offset:3px}.controller{display:grid;gap:16px}.section-card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}.status-card{padding:28px 30px;background:#fdfefd}.top,.playlist-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-kicker{margin:0 0 7px;font-size:10px;letter-spacing:.13em;color:#7b8b83;font-weight:750}.top .section-kicker{margin:0}.pill{font-size:11px;font-weight:650;border-radius:20px;padding:6px 10px;background:#f0f3f1;color:#66746e}.pill.on{color:#26775c;background:#e7f4ed}.pill.off{color:#9b5b33;background:#fbf0e5}.summary{font-size:clamp(21px,4vw,29px);font-weight:620;letter-spacing:-.045em;margin:23px 0 8px;line-height:1.35}.meta{font-size:12px;line-height:1.7;color:var(--muted);margin:7px 0}.primary-actions{display:flex;gap:10px;margin-top:24px}.primary-actions button{min-width:140px}.connection-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}button,a.btn{font:inherit;font-size:12px;font-weight:600;padding:11px 14px;min-height:42px;border-radius:9px;border:1px solid #dbe4de;background:#fff;color:#34483e;cursor:pointer;text-decoration:none;text-align:center}button:hover,a.btn:hover{background:#f2f6f3}button.primary{background:#284d3d;border-color:#284d3d;color:#fff}button.primary:hover{background:#1f3e30}button.danger{color:#a74039;border-color:#ecc8c5;background:#fff7f6}button.warn{color:#89572a}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7fae99;outline-offset:3px}.text-button{border:0;padding:3px 0;min-height:32px;color:#577565;background:transparent;font-size:11px}.content-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}h2{font-size:18px;font-weight:650;margin:0;letter-spacing:-.035em}h3{font-size:15px;font-weight:600}.playlist-heading>span{font-size:11px;color:var(--muted)}.playlist-today{margin-top:20px}.playlist-url{display:block;font-size:11px;color:#507965;line-height:1.7;overflow-wrap:anywhere;margin:12px 0}.playlist-actions{display:flex;gap:8px;margin-top:12px}.playlist-actions button{flex:1}.playlist-history-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:20px;color:#607368;background:#f8faf8;border:0}.playlist-history{margin-top:18px}.playlist-search{display:grid;gap:8px}.playlist-search>div{display:flex;gap:8px}.playlist-search input{flex:1;min-width:0}.playlist-search small,.playlist-state,.playlist-error{font-size:11px;color:var(--muted);line-height:1.6}.playlist-search label{font-size:12px}.playlist-nav{display:flex;gap:8px;margin:12px 0}.playlist-nav>*{flex:1}.playlist-list{display:grid;gap:8px}.playlist-item{border-top:1px solid var(--line);padding:14px 0}.playlist-date{font-size:13px;font-weight:650}.playlist-state.ready{color:var(--good)}.playlist-state.bad,.playlist-error{color:var(--bad)}.upload-date-label{display:grid;gap:4px;font-size:10px;color:var(--muted)}input,select{font:inherit;font-size:12px;background:#f9fbf9;color:#2b4236;border:1px solid #dce5de;border-radius:8px;padding:9px;max-width:100%}.upload-date-label input{width:132px;padding:7px;font-size:11px;min-width:0}.upload-overview{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 10px;padding:12px;background:#f5f8f5;border-radius:10px}.upload-overview strong{font-size:12px;font-weight:650}.upload-overview>span{font-size:10px;color:var(--muted);text-align:right}.upload-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0ed}.upload-row:last-child{border-bottom:0}.upload-slot{min-width:52px;font-size:12px;font-weight:650}.upload-info{flex:1;min-width:0}.upload-state{font-size:11px;color:#77847c}.upload-state.completed{color:#2c7e5b}.upload-state.uploading{color:#3e6a9e}.upload-state.failed{color:#b84940}.upload-info small{display:block;font-size:10px;color:#7a8880;line-height:1.6;margin-top:4px}.video-link{display:inline-flex;align-items:center;min-height:36px;padding:4px;font-size:11px;white-space:nowrap;color:#4a6b59;text-decoration:none}.estimate-note{font-size:10px;line-height:1.7;color:#869188;margin:14px 0 0}.latest-upload{margin-top:10px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}details.section-card{padding:0}details.section-card>summary{cursor:pointer;list-style:none;font-size:13px;font-weight:650;padding:21px 24px;display:flex;justify-content:space-between;gap:12px}details.section-card>summary::-webkit-details-marker{display:none}details.section-card>summary span{font-size:11px;font-weight:400;color:var(--muted)}details.section-card>summary:after{content:"+";color:#8c9b91}details[open].section-card>summary:after{content:"−"}details.section-card>section,details.section-card>.actions,details.section-card>p{margin:0 24px 20px}details.section-card p{font-size:12px;line-height:1.7;color:var(--muted)}details.section-card h3{margin-top:0}.device-meta{padding-top:12px}.install{display:none}.install.show{display:block}.install{padding:13px 17px;margin-bottom:16px;background:transparent;border-style:dashed;border-radius:12px}.install-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.install h2{font-size:12px;margin:0 0 4px}.install p{font-size:11px;color:var(--muted);margin:0}.install button{font-size:11px;padding:8px 12px;flex:none}.notice{display:none;position:sticky;top:10px;z-index:5;border:1px solid #d1e2d6;background:#eef6f0;padding:13px 16px;font-size:12px;border-radius:10px;margin-bottom:15px}.notice.show{display:block}.notice.error{color:#9e453b;background:#fff1ee;border-color:#efd6d0}.empty{padding:30px;color:var(--muted);text-align:center;font-size:13px;border:1px dashed var(--line);border-radius:14px}.footer{font-size:10px;text-align:center;color:#8a958e;margin-top:26px;line-height:1.8}dialog{border:1px solid var(--line);border-radius:16px;background:#fff;color:#263d30;padding:24px;max-width:min(580px,calc(100vw - 32px));box-shadow:0 20px 90px #172e2333}dialog::backdrop{background:#15261e66}dialog h2{margin-bottom:15px}dialog p{font-size:13px;line-height:1.7;color:var(--muted)}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto;background:#f3f6f3;padding:14px;border-radius:10px}
@media(max-width:760px){.content-grid{grid-template-columns:1fr}.shell{max-width:580px;padding:22px 16px 32px}.head{margin-bottom:20px}.who span{display:none}.section-card{padding:21px}.status-card{padding:23px}.primary-actions button{flex:1;min-width:0}.playlist-heading h2{font-size:17px}.connection-meta{font-size:10px}.install p{max-width:225px}.upload-row{padding:13px 0}}
@media(prefers-reduced-motion:no-preference){button,a.btn{transition:background .15s ease}}
.fold-body{padding:0 24px 22px}.shutdown>label{font-size:12px}.shutdown{margin:0}.section-card.shutdown h2{margin-bottom:12px}
button,a.btn,input,select{min-height:44px}.actions>:last-child:nth-child(odd){grid-column:1/-1}details.section-card>.primary-actions{margin:0 24px 20px}details.section-card>summary{align-items:center}details.section-card>summary span{margin-left:auto;text-align:right}details.section-card>summary:after{flex:none}.primary-actions>*{min-width:0;flex:1}.primary-actions,.connection-meta,.playlist-heading{flex-wrap:wrap}.connection-meta>.text-button{margin-left:auto}.upload-slot{overflow-wrap:anywhere}.upload-info{overflow-wrap:anywhere}
@media(max-width:760px){details.section-card>.primary-actions{margin-inline:21px}.fold-body{padding-inline:21px}details.section-card>summary{padding-inline:21px}details.section-card>summary span{font-size:10px}.primary-actions{gap:8px}.brand{min-width:0}}
</style>
</head>
<body class="auth-pending">
  <main class="shell">
    <header class="head">
      <div class="brand"><img src="/icons/icon-192.png?v=1" alt="" width="64" height="64"><div><p class="eyebrow">SILENTSTREAM</p><h1 id="roomHeading">호실</h1></div></div>
      <div class="who"><span id="who">로그인 확인 중…</span><br><a href="/auth/logout">로그아웃</a></div>
    </header>

    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <section id="room"><div class="empty">강의실 상태를 불러오는 중입니다.</div></section>
    <section class="panel install" id="installCard" aria-live="polite">
      <div class="install-row"><div><h2 id="installTitle">담당자 앱 설치</h2><p id="installGuide">이 호실을 홈 화면에서 바로 열 수 있습니다.</p></div><button class="primary" id="installButton">앱 설치</button></div>
    </section>
    <footer class="footer"><a id="centralLink" href="https://admin.silentstream.win/control/">전체 중앙 관리</a> · <a href="https://silentstream.win/guide.html#remote">사용 안내</a> · 한국 시간 기준</footer>
  </main>
  <dialog id="installHelp"><h2 id="installHelpTitle">담당자 앱 설치</h2><div id="installHelpBody"></div><div class="actions"><button class="primary" id="copyInstallAddress">설치 주소 복사</button><button id="closeInstallHelp">닫기</button></div></dialog>
  <dialog id="detail"><h2 id="detailTitle">상세 상태</h2><pre id="detailBody"></pre><button id="closeDetail">닫기</button></dialog>
  <dialog id="playlistCopyHelp"><h2>재생목록 링크 복사</h2><p>아래 링크를 길게 눌러 복사해주세요.</p><input id="playlistCopyAddress" readonly aria-label="재생목록 링크" style="width:100%;box-sizing:border-box;padding:12px;font-size:16px"><button id="closePlaylistCopyHelp" style="margin-top:12px">닫기</button></dialog>
  <script src="/upload-view.js?v=2" defer></script>
  <script src="/app.js?v=20" defer></script>
</body>
</html>
